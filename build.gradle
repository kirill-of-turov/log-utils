import java.text.SimpleDateFormat

plugins {
    id 'application'
    id 'java'
    id 'com.gradleup.shadow' version '9.4.1'
}

group 'com.github.kot'
version = project.findProperty('version') ?: '1.0'

ext {
    commonsIOVersion = '2.22.0'
    freemarkerVersion = '2.3.34'
    jakartaMailVersion = '2.0.2'
    javaMainClass = 'com.github.kot.log.utils.Runner'
    junitVersion = '6.0.3'
    logbackVersion = '1.5.32'
    lombokVersion = '1.18.46'
    mssqlJdbcVersion = '13.4.0.jre11'
    springVersion = '7.0.7'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    mainClass = javaMainClass
    println('System properties (key:value)')
    System.getProperties().forEach((k, v) -> println(k + ':' + v))
    String jvmArgs = System.getProperty('org.gradle.jvmargs')
    if (jvmArgs != null) {
        applicationDefaultJvmArgs = List.of(jvmArgs)
        println('Application default JVM arguments')
        applicationDefaultJvmArgs.forEach(a -> println(a))
    }
}

jar {
    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }
}

repositories {
    mavenCentral()
}

test {
    useJUnitPlatform()
}

dependencies {
    implementation "com.sun.mail:jakarta.mail:$jakartaMailVersion"
    implementation "org.freemarker:freemarker:$freemarkerVersion"
    testImplementation "org.junit.jupiter:junit-jupiter-engine:$junitVersion"
    implementation "com.microsoft.sqlserver:mssql-jdbc:$mssqlJdbcVersion"
    implementation "org.springframework:spring-jdbc:$springVersion"
    implementation "commons-io:commons-io:$commonsIOVersion"
    compileOnly "org.projectlombok:lombok:$lombokVersion"
    testCompileOnly "org.projectlombok:lombok:$lombokVersion"
    implementation "ch.qos.logback:logback-classic:$logbackVersion"
    annotationProcessor "org.projectlombok:lombok:$lombokVersion"
    testAnnotationProcessor "org.projectlombok:lombok:$lombokVersion"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
