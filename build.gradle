plugins {
    id 'application'
    id 'java'
}

group 'com.github.kot'
version '1.0'

ext {
    commonsIOVersion = '2.17.0'
    freemarkerVersion = '2.3.33'
    jakartaMailVersion = '2.0.1'
    javaMainClass = 'com.github.kot.log.utils.Runner'
    junitVersion = '5.11.3'
    logbackVersion = '1.5.12'
    lombokVersion = '1.18.34'
    mssqlJdbcVersion = '12.8.1.jre11'
    springVersion = '6.1.14'
}

application {
    mainClassName = javaMainClass
    println("System properties (key:value)")
    System.getProperties().forEach((k, v) -> println(k + ":" + v))
    String jvmArgs = System.getProperty("org.gradle.jvmargs")
    if (jvmArgs != null) {
        applicationDefaultJvmArgs = List.of(jvmArgs)
        println("Application default JVM arguments")
        applicationDefaultJvmArgs.forEach(a -> println(a))
    }
}

repositories {
    mavenCentral()
}

test {
    useJUnitPlatform()
}

dependencies {
    implementation group: 'com.sun.mail', name: 'jakarta.mail', version: jakartaMailVersion
    implementation group: 'org.freemarker', name: 'freemarker', version: freemarkerVersion
    testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-engine', version: junitVersion
    implementation group: 'com.microsoft.sqlserver', name: 'mssql-jdbc', version: mssqlJdbcVersion
    implementation group: 'org.springframework', name: 'spring-jdbc', version: springVersion
    implementation group: 'commons-io', name: 'commons-io', version: commonsIOVersion
    compileOnly group: 'org.projectlombok', name: 'lombok', version: lombokVersion
    testCompileOnly group: 'org.projectlombok', name: 'lombok', version: lombokVersion
    implementation group: 'ch.qos.logback', name: 'logback-classic', version: logbackVersion
    annotationProcessor group: 'org.projectlombok', name: 'lombok', version: lombokVersion
    testAnnotationProcessor group: 'org.projectlombok', name: 'lombok', version: lombokVersion
}